# UNVEIL 공식 홈페이지 — Netlify 설정

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# 서비스워커와 매니페스트는 캐시하면 업데이트가 걸리지 않습니다.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Vite가 만드는 /assets/* 파일명에는 해시가 붙으므로 영구 캐시가 안전합니다.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# 탭 아이콘은 자주 안 바뀌지만, 바꿨을 때 하루 안에는 반영되게 둡니다.
[[headers]]
  for = "/favicon.*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # 다른 사이트가 UNVEIL 을 iframe 에 넣어 클릭을 가로채는 것을 막습니다.
    X-Frame-Options = "DENY"
    # 쓰지 않는 브라우저 기능을 미리 꺼둡니다.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin"
    # 'unsafe-inline' 이 필요한 이유:
    #   - 사주·별자리·탄생석 앱이 전부 인라인 <script> / <style> 로 되어 있습니다.
    #   - React 쪽도 style={{...}} 로 인라인 스타일을 씁니다.
    # 그래도 script-src 'self' 덕분에 외부 도메인 스크립트 주입은 차단됩니다.
    # ※ 나중에 Google Analytics 를 붙이면 script-src 와 connect-src 에
    #   https://www.googletagmanager.com https://www.google-analytics.com 을 추가해야 합니다.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'"

# SPA 캐치올 리다이렉트는 두지 않습니다.
#
# 이 사이트는 클라이언트 라우터를 쓰지 않는 여러 개의 실제 페이지로 되어 있습니다.
# /* → /index.html (200) 규칙을 두면 없는 주소로 들어와도 홈페이지가 200 으로 응답해서
#   1) 404.html 이 영원히 표시되지 않고
#   2) 검색엔진이 존재하지 않는 주소를 정상 페이지로 수집합니다 (소프트 404)
#
# 없는 주소는 public/404.html 이 404 상태로 응답하도록 둡니다.
