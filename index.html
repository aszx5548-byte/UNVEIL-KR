<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!--
      보안 정책을 HTML 안에 넣어둡니다.
      Netlify 는 netlify.toml, Cloudflare Pages 는 _headers 로 헤더를 줄 수 있지만
      Cloud Run(구글 AI Studio 배포)처럼 헤더를 설정할 수 없는 곳도 있습니다.
      meta 로 넣어두면 어디에 올리든 이 정책은 따라갑니다.
      (frame-ancestors 는 meta 로 전달되지 않으므로 헤더 쪽에만 둡니다)
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <script>
      /* 통합 전에 사주 앱 주소로 공유된 결과 링크(?d=...&c=...&g=...)를 /saju/ 로 넘겨줍니다.
         이게 없으면 카카오톡 등으로 이미 퍼진 결과 링크가 결과 대신 홈으로 떨어집니다.
         React 가 뜨기 전에 실행되도록 head 최상단에 둡니다. */
      (function () {
        var q = location.search;
        if (!q) return;
        try {
          var p = new URLSearchParams(q);
          if (p.has('d') && p.has('c')) {
            location.replace('/saju/' + q + location.hash);
          }
        } catch (e) {}
      })();
    </script>

    <!-- ─────────────────────────────────────────────────────────
         검색엔진 사이트 소유 확인
         지우지 마세요. 지우면 인증이 풀려 수집 요청과 통계가 끊깁니다.
         SEO 태그가 아니라 "이 사이트가 우리 것"임을 증명하는 값이며,
         각 서비스 계정마다 값이 다릅니다.

         네이버  https://searchadvisor.naver.com   등록 2026-08-12
         구글    (서치콘솔 태그를 받으면 여기에 추가)
         빙      (웹마스터도구 태그를 받으면 여기에 추가)

         주소가 바뀌면 값도 새로 발급됩니다. 사이트를 다시 등록하면
         네이버가 새 값을 주므로, 옛 값은 지우고 새 값으로 바꿉니다.
         (2026-08-12 unveil.ai.studio 삭제 → 새 주소로 재등록하며 교체)
         ───────────────────────────────────────────────────────── -->
    <meta
      name="naver-site-verification"
      content="6f6e09b293607d0a8f42cd0b7bed6b1b7d2f5757"
    />

    <title>UNVEIL | 사주오행·별자리·탄생석으로 찾는 나의 원석</title>
    <meta
      name="description"

    />

    <!-- 배포 주소. 도메인이 바뀌면 이 파일에서 unveil.ai.studio 를 일괄 치환하고
         public/sitemap.xml · public/robots.txt 도 함께 고쳐야 합니다. -->
    <link rel="canonical" href="https://unveil.ai.studio/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="UNVEIL" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:url" content="https://unveil.ai.studio/" />
    <meta property="og:title" content="UNVEIL | 사주오행·별자리·탄생석으로 찾는 나의 원석" />
    <meta
      property="og:description"
      content="사주오행·별자리·탄생석으로 나와 연결되는 의미와 원석을 찾고, 직접 검수한 천연 원석 실물을 확인해보세요."
    />
    <!-- 카카오톡·인스타 공유 썸네일.
         · 반드시 절대주소여야 크롤러가 읽습니다.
         · 1200x630 이 권장 규격이고, 이보다 작으면 작은 카드로 표시됩니다.
         · WebP 가 아닌 JPG 입니다. 카카오톡 등 일부 크롤러가 WebP 를 읽지 못합니다. -->
    <meta property="og:image" content="https://unveil.ai.studio/images/og-cover.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="어두운 석재 위에 놓인 UNVEIL 천연 원석팔찌" />
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="theme-color" content="#07111F" />
