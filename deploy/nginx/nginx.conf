# 빌드 결과물(dist/)을 정적으로 서빙합니다.
#
# Cloud Run 은 PORT 환경변수로 포트를 알려주는데 기본값이 8080 이고,
# nginx 설정에서는 환경변수를 직접 못 읽습니다. 8080 으로 고정합니다.

server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # 한글 콘텐츠라 인코딩을 명시합니다.
  charset utf-8;
  charset_types text/css text/plain text/xml application/javascript application/json;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/xml application/javascript application/json
             application/xml image/svg+xml application/manifest+json;

  # 서버 버전을 숨깁니다.
  server_tokens off;

  # ── 일반 페이지 ────────────────────────────────
  # /birthstone/5/ 처럼 디렉터리 주소면 그 안의 index.html 을 내보냅니다.
  # SPA 처럼 전부 index.html 로 보내지 않습니다. 없는 주소는 진짜 404 여야
  # 검색엔진이 유령 페이지를 색인하지 않습니다.
  location / {
    include /etc/nginx/security-headers.conf;
    try_files $uri $uri/ =404;
  }

  # ── 파일명에 해시가 붙는 자산 ──────────────────
  location /assets/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location /images/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
    try_files $uri =404;
  }

  # ── 캐시하면 갱신이 안 걸리는 파일 ─────────────
  location = /sw.js {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
  }

  location = /manifest.json {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
  }

  # 크롤러가 자주 확인하는 파일이라 오래 캐시하지 않습니다.
  location ~ ^/(robots\.txt|sitemap\.xml|llms\.txt)$ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=3600" always;
  }

  # ── 404 ────────────────────────────────────────
  # 상태 코드는 404 를 유지한 채 우리 404.html 을 보여줍니다.
  error_page 404 /404.html;
  location = /404.html {
    include /etc/nginx/security-headers.conf;
    internal;
  }

  # 헬스체크용. 로그를 남기지 않습니다.
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }
}
