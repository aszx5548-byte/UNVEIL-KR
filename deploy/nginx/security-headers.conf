# 모든 응답에 붙는 보안 헤더입니다.
#
# public/_headers 와 같은 내용이지만, 그 파일은 Cloudflare Pages · Netlify 만 읽습니다.
# Cloud Run 은 읽지 않으므로 여기서 nginx 가 직접 붙여줍니다.
#
# nginx 규칙 하나만 기억하면 됩니다.
#   location 블록 안에서 add_header 를 한 번이라도 쓰면
#   바깥에서 상속받던 add_header 가 전부 사라집니다.
# 그래서 Cache-Control 을 따로 주는 location 마다 이 파일을 다시 include 합니다.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# frame-ancestors 는 meta 태그로는 동작하지 않는 항목이라,
# 여기(HTTP 헤더)에서만 실제로 적용됩니다.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
